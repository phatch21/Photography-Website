<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Freight+Display+Pro&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <div class="nav-content">
        <div class="nav-name">Corinne Hatch Photography</div>
        <div class="nav-menu" onclick="openPopup()">
          <span class="hamburger-icon">&#9776;</span>
        </div>
      </div>
    </nav>
    <!-- Main Content -->
    <div class="admin-dashboard">
      <h1>Welcome, Admin!</h1>
      <p>Select an action to manage your website:</p>
      <!-- Admin Action Buttons -->
      <div class="admin-actions">
        <a href="#" class="admin-action-button">Maintain Admins</a>
        <a href="#" class="admin-action-button">Maintain Images</a>
      </div>
    </div>
    <!-- Popup Dropdown -->
    <div class="popup-dropdown" id="popupDropdown">
      <div class="dropdown-content">
        <span class="close-icon" onclick="closePopup()">&#10005;</span>
        <a href="index.html" onclick="closePopup()">Home</a>
        <a href="gallery.html" onclick="closePopup()">Gallery</a>
        <a href="admin.html" onclick="closePopup()">Admin</a>
      </div>
    </div>
    <script>
      // Popup Dropdown functions
      function openPopup() {
        const dropdown = document.getElementById("popupDropdown");
        const navMenu = document.querySelector(".nav-menu");
        const rect = navMenu.getBoundingClientRect();
        dropdown.style.display = "block";
        dropdown.style.position = "absolute";
        dropdown.style.top = rect.bottom + window.scrollY + "px";
        dropdown.style.left = rect.right - 180 + window.scrollX + "px"; // 180px = dropdown width
      }
      function closePopup() {
        document.getElementById("popupDropdown").style.display = "none";
      }
      // Close dropdown when clicking outside
      document.addEventListener("mousedown", function (e) {
        const dropdown = document.getElementById("popupDropdown");
        const navMenu = document.querySelector(".nav-menu");
        if (
          dropdown.style.display === "block" &&
          !dropdown.contains(e.target) &&
          !navMenu.contains(e.target)
        ) {
          closePopup();
        }
      });
    </script>
  </body>
</html>
