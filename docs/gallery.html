<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Google Fonts and Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Freight+Display+Pro&display=swap"
      rel="stylesheet"
    />
  </head>
  <body style="min-height: 100vh; display: flex; flex-direction: column">
    <!-- Navbar -->
    <nav class="navbar">
      <div class="nav-content">
        <div class="nav-name">
          <a href="index.html" style="color: inherit; text-decoration: none"
            >Corinne Hatch Photography</a
          >
        </div>
        <div class="nav-menu" onclick="openNavPopup()">
          <span class="hamburger-icon">&#9776;</span>
        </div>
      </div>
    </nav>
    <!-- Popup Dropdown -->
    <div class="popup-dropdown" id="popupDropdown">
      <div class="dropdown-content">
        <span class="close-icon" onclick="closePopup()">&#10005;</span>
        <a href="index.html" onclick="closePopup()">Home</a>
        <a href="gallery.html" onclick="closePopup()">Gallery</a>
        <a href="admin.html" onclick="closePopup()">Admin</a>
        <a href="contact.html" onclick="closePopup()">Contact</a>
      </div>
    </div>
    <div class="gallery-title">Photo Gallery</div>
    <!-- Dropdowns Row: Category and Album -->
    <div class="dropdown-row">
      <div class="dropdown">
        <label for="photo-category">Select Category:</label>
        <select id="photo-category">
          <option value="all">All Categories</option>
          <option value="nature">Nature</option>
          <option value="people">People</option>
          <option value="architecture">Architecture</option>
        </select>
      </div>
      <div class="dropdown">
        <label for="photo-album">Select Album:</label>
        <select id="photo-album">
          <option value="all">All Albums</option>
          <option value="all">All Albums</option>
          <option value="album1">Album 1</option>
          <option value="album2">Album 2</option>
        </select>
      </div>
    </div>
    <section class="gallery grid-gallery">
      <div class="photo-container"><img src="blur.jpeg" alt="blur" /></div>
      <div class="photo-container">
        <img src="closeelephant.jpeg" alt="closeelephant" />
      </div>
      <div class="photo-container"><img src="dock.jpeg" alt="dock" /></div>
      <div class="photo-container">
        <img src="elephant.jpeg" alt="elephant" />
      </div>
      <div class="photo-container"><img src="eye.jpeg" alt="eye" /></div>
      <div class="photo-container">
        <img src="flytrap.jpeg" alt="flytrap" />
      </div>
      <div class="photo-container">
        <img src="girlflower.jpeg" alt="girlflower" />
      </div>
      <div class="photo-container">
        <img src="girlsmile.jpeg" alt="girlsmile" />
      </div>
      <div class="photo-container"><img src="lamp.jpeg" alt="lamp" /></div>
      <div class="photo-container"><img src="laugh.jpeg" alt="laugh" /></div>
      <div class="photo-container">
        <img src="littleboy.jpeg" alt="littleboy" />
      </div>
      <div class="photo-container"><img src="monkey.jpeg" alt="monkey" /></div>
      <div class="photo-container">
        <img src="mountain.jpeg" alt="mountain" />
      </div>
      <div class="photo-container">
        <img src="purpflower.jpeg" alt="purpflower" />
      </div>
      <div class="photo-container">
        <img src="reflection.jpeg" alt="reflection" />
      </div>
      <div class="photo-container"><img src="sky.jpeg" alt="sky" /></div>
      <div class="photo-container"><img src="smile.jpeg" alt="smile" /></div>
      <div class="photo-container"><img src="snail.jpeg" alt="snail" /></div>
      <div class="photo-container"><img src="temple.jpeg" alt="temple" /></div>
    </section>
    <!-- Image Popup Modal -->
    <div class="popup-modal" id="popupModal">
      <div class="popup-image-wrapper">
        <img id="popupImage" src="" alt="Expanded Image" />
        <span class="close-icon" onclick="closeImagePopup()">&times;</span>
      </div>
    </div>
    <footer class="footer" style="margin-top: auto">
      <div class="footer-content">
          <a
            href="https://www.instagram.com/_corinne.hatch_?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
            target="_blank"
            class="icon instagram"
          >
            <i class="fab fa-instagram"></i>
          </a>
          <!-- <a href="https://www.twitter.com" target="_blank" class="icon twitter">
          <i class="fab fa-twitter"></i>
        </a>
        <a href="https://www.linkedin.com" target="_blank" class="icon linkedin">
          <i class="fab fa-linkedin"></i>
        </a> -->
        </div>
        <p>&copy; 2024 Corinne Photography. All Rights Reserved.</p>
      </div>
    </footer>
    <script>
      // Navigation Popup functions
      // Popup Dropdown functions
      function openNavPopup() {
        openPopup();
      }
      function closeNavPopup() {
        closePopup();
      }
      function openPopup() {
        const dropdown = document.getElementById("popupDropdown");
        const navMenu = document.querySelector(".nav-menu");
        const rect = navMenu.getBoundingClientRect();
        dropdown.style.display = "block";
        dropdown.style.position = "absolute";
        dropdown.style.top = rect.bottom + window.scrollY + "px";
        dropdown.style.left = rect.right - 180 + window.scrollX + "px"; // 180px = dropdown width
      }
      function closePopup() {
        document.getElementById("popupDropdown").style.display = "none";
      }
      // Close dropdown when clicking outside
      document.addEventListener("mousedown", function (e) {
        const dropdown = document.getElementById("popupDropdown");
        const navMenu = document.querySelector(".nav-menu");
        if (
          dropdown.style.display === "block" &&
          !dropdown.contains(e.target) &&
          !navMenu.contains(e.target)
        ) {
          closePopup();
        }
      });
      // Open Photo Popup
      function openPhoto(imagePath) {
        const popupModal = document.getElementById("popupModal");
        const popupImage = document.getElementById("popupImage");
        popupModal.style.display = "flex";
        popupImage.src = imagePath;
      }
      // Close only the image popup
      function closeImagePopup() {
        document.getElementById("popupModal").style.display = "none";
      }
      // Add click event to all images
      document.querySelectorAll(".photo-container img").forEach((img) => {
        img.addEventListener("click", function () {
          openPhoto(this.src);
        });
        // Detect aspect ratio and assign class to parent
        img.addEventListener("load", function () {
          const aspect = img.naturalWidth / img.naturalHeight;
          const parent = img.closest(".photo-container");
          parent.classList.remove("landscape", "portrait", "square");
          if (aspect > 1.2) {
            parent.classList.add("landscape");
          } else if (aspect < 0.8) {
            parent.classList.add("portrait");
          } else {
            parent.classList.add("square");
          }
        });
        // If already loaded (cache), trigger manually
        if (img.complete) {
          const aspect = img.naturalWidth / img.naturalHeight;
          const parent = img.closest(".photo-container");
          parent.classList.remove("landscape", "portrait", "square");
          if (aspect > 1.2) {
            parent.classList.add("landscape");
          } else if (aspect < 0.8) {
            parent.classList.add("portrait");
          } else {
            parent.classList.add("square");
          }
        }
      });
      // Filter Gallery Based on Album and Category (static logic)
      function applyFilter() {
        const selectedCategory =
          document.getElementById("photo-category").value;
        const selectedAlbum = document.getElementById("photo-album").value;
        const photos = document.querySelectorAll(".photo-container");
        photos.forEach((photo, idx) => {
          // For demo, assign categories/albums by index
          let photoCategory = "nature";
          let photoAlbum = "album1";
          if (idx % 3 === 1) photoCategory = "people";
          if (idx % 3 === 2) photoCategory = "architecture";
          if (idx % 2 === 1) photoAlbum = "album2";
          // Check if filters match or if "all" is selected
          const matchesCategory =
            selectedCategory === "all" || selectedCategory === photoCategory;
          const matchesAlbum =
            selectedAlbum === "all" || selectedAlbum === photoAlbum;
          if (matchesCategory && matchesAlbum) {
            photo.style.display = "block";
          } else {
            photo.style.display = "none";
          }
        });
      }
      document
        .getElementById("photo-category")
        .addEventListener("change", applyFilter);
      document
        .getElementById("photo-album")
        .addEventListener("change", applyFilter);
      window.onload = applyFilter;
    </script>
  </body>
</html>
