<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Corinne Hatch</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Freight+Display+Pro&display=swap" rel="stylesheet" />
    <style>
      body, html {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      .contact-bg {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        overflow: hidden;
      }
      .contact-bg img {
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        filter: brightness(0.7);
      }
      .contact-content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        text-align: center;
        z-index: 2;
      }
      .contact-content h1 {
        font-size: 3rem;
        margin-bottom: 1.5rem;
        font-family: "Freight Display Pro", serif;
      }
      .contact-content a {
        display: inline-block;
        font-size: 1.5rem;
        color: #fff;
        background: #333;
        padding: 16px 32px;
        border-radius: 8px;
        text-decoration: none;
        margin-top: 1.5rem;
        transition: background 0.2s;
      }
      .contact-content a:hover {
        background: #555;
      }
      /* Navbar styles */
      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.8);
        color: #fff;
        padding: 10px 20px;
        z-index: 3;
      }
      .navbar.contact .hamburger-icon {
        color: #fff;
      }
      .nav-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .nav-name a {
        color: #fff;
        text-decoration: none;
        font-size: 1.5rem;
        font-family: "Freight Display Pro", serif;
      }
      .nav-menu {
        cursor: pointer;
      }
      .hamburger-icon {
        font-size: 1.5rem;
      }
      /* Popup Dropdown styles */
      .popup-dropdown {
        display: none;
        position: absolute;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        z-index: 4;
      }
      .dropdown-content {
        padding: 10px;
        text-align: left;
      }
      .dropdown-content a {
        display: block;
        padding: 10px;
        color: #333;
        text-decoration: none;
        transition: background 0.2s;
      }
      .dropdown-content a:hover {
        background: #f0f0f0;
      }
      .close-icon {
        cursor: pointer;
        font-size: 1.2rem;
        float: right;
      }
    </style>
  </head>
  <body style="min-height: 100vh; display: flex; flex-direction: column;">
    <!-- Navbar -->
    <nav class="navbar contact">
      <div class="nav-content">
        <div class="nav-name">
          <a href="index.html" style="color: inherit; text-decoration: none">Corinne Hatch Photography</a>
        </div>
        <div class="nav-menu" onclick="openPopup()">
          <span class="hamburger-icon">&#9776;</span>
        </div>
      </div>
    </nav>
    <!-- Popup Dropdown -->
    <div class="popup-dropdown" id="popupDropdown">
      <div class="dropdown-content">
        <span class="close-icon" onclick="closePopup()">&#10005;</span>
        <a href="index.html" onclick="closePopup()">Home</a>
        <a href="gallery.html" onclick="closePopup()">Gallery</a>
        <a href="admin.html" onclick="closePopup()">Admin</a>
        <a href="contact.html" onclick="closePopup()">Contact</a>
      </div>
    </div>
    <div class="contact-bg">
      <img src="mountain.jpeg" alt="Landscape Background" />
    </div>
    <div class="contact-content">
      <h1>Contact Corinne Hatch</h1>
      <a href="mailto:corinne@example.com">corinne@example.com</a>
    </div>
    <footer class="footer" style="margin-top: auto;">
      <div class="footer-content">
        <div class="social-icons">
          <a href="https://www.instagram.com/_corinne.hatch_?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw==" target="_blank" class="icon instagram">
            <i class="fab fa-instagram"></i>
          </a>
          <!-- <a href="https://www.twitter.com" target="_blank" class="icon twitter">
          <i class="fab fa-twitter"></i>
        </a>
        <a href="https://www.linkedin.com" target="_blank" class="icon linkedin">
          <i class="fab fa-linkedin"></i>
        </a> -->
        </div>
        <p>&copy; 2025 Corinne Photography. All Rights Reserved.</p>
      </div>
    </footer>
    <script>
      function openPopup() {
        const dropdown = document.getElementById("popupDropdown");
        const navMenu = document.querySelector(".nav-menu");
        const rect = navMenu.getBoundingClientRect();
        dropdown.style.display = "block";
        dropdown.style.position = "absolute";
        dropdown.style.top = rect.bottom + window.scrollY + "px";
        dropdown.style.left = rect.right - 180 + window.scrollX + "px";
      }
      function closePopup() {
        document.getElementById("popupDropdown").style.display = "none";
      }
      document.addEventListener("mousedown", function (e) {
        const dropdown = document.getElementById("popupDropdown");
        const navMenu = document.querySelector(".nav-menu");
        if (
          dropdown.style.display === "block" &&
          !dropdown.contains(e.target) &&
          !navMenu.contains(e.target)
        ) {
          closePopup();
        }
      });
    </script>
  </body>
</html>
